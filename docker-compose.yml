services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sv"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_URL: jdbc:postgresql://db:5432/sv
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
